<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca de Seções</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/img/logo.jpeg"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="layout">
      <!-- ─── Sidebar ─── -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <!-- ✏️ Troque o href pelo link da sua empresa -->
          <a href="#" onclick="goHome(); return false;">
            <div class="logo-mark">
              <img src="assets/img/logo.jpeg" alt="Logo" />
            </div>

            <div class="logo-text">
              <strong>Biblioteca</strong>
              <span>Seções reutilizáveis</span>
            </div>
          </a>
        </div>

        <div class="sidebar-section">Categorias</div>
        <div class="cat-list" id="catList"></div>

        <div class="sidebar-footer">
          <button class="btn-new-cat" onclick="openCatModal()">
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Nova categoria
          </button>
        </div>
      </aside>

      <!-- ─── Main ─── -->
      <main class="main">
        <div class="topbar">
          <div class="topbar-left">
            <div class="topbar-title" id="pageTitle">
              Selecione uma categoria
            </div>
            <div class="topbar-sub" id="pageCount"></div>
          </div>
          <div class="search-box">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="Buscar seção..."
              oninput="renderCards()"
            />
          </div>
          <button
            class="btn-primary"
            id="addCompBtn"
            onclick="openCompModal()"
            style="display: none"
          >
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Adicionar seção
          </button>
        </div>

        <div class="content" id="mainContent"></div>
      </main>
    </div>

    <!-- ═══ Detail Modal ═══ -->
    <div class="overlay" id="detailOverlay">
      <div class="detail-modal">
        <div class="modal-head">
          <div class="modal-head-info">
            <div class="modal-head-title" id="detailTitle"></div>
            <div class="modal-head-sub" id="detailSub"></div>
          </div>
          <button class="btn-close" onclick="closeDetail()">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>

        <div class="modal-img-wrap" id="detailImgWrap"></div>

        <div class="modal-tabs-wrap">
          <div class="modal-tabs">
            <button class="tab-btn active" onclick="switchTab('html')">
              HTML
            </button>
            <button class="tab-btn" onclick="switchTab('css')">CSS</button>
            <button class="tab-btn" onclick="switchTab('js')">
              JavaScript
            </button>
          </div>
        </div>

        <div class="modal-body">
          <div class="code-panel active" id="panel-html">
            <div class="code-header">
              <span class="code-label">HTML</span>
              <button
                class="btn-copy-code"
                id="copyHtmlBtn"
                onclick="copyTab('html')"
              >
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="9" y="9" width="13" height="13" rx="2" />
                  <path
                    d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"
                  />
                </svg>
                Copiar HTML
              </button>
            </div>
            <div id="codeHtml" class="code-block"></div>
          </div>
          <div class="code-panel" id="panel-css">
            <div class="code-header">
              <span class="code-label">CSS</span>
              <button
                class="btn-copy-code"
                id="copyCssBtn"
                onclick="copyTab('css')"
              >
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="9" y="9" width="13" height="13" rx="2" />
                  <path
                    d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"
                  />
                </svg>
                Copiar CSS
              </button>
            </div>
            <div id="codeCss" class="code-block"></div>
          </div>
          <div class="code-panel" id="panel-js">
            <div class="code-header">
              <span class="code-label">JavaScript</span>
              <button
                class="btn-copy-code"
                id="copyJsBtn"
                onclick="copyTab('js')"
              >
                <svg
                  width="12"
                  height="12"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="9" y="9" width="13" height="13" rx="2" />
                  <path
                    d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"
                  />
                </svg>
                Copiar JS
              </button>
            </div>
            <div id="codeJs" class="code-block"></div>
          </div>
        </div>

        <div class="modal-footer">
          <div class="footer-actions">
            <button
              class="btn-icon-sm"
              id="detailEditBtn"
              onclick="editFromDetail()"
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"
                />
                <path
                  d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"
                />
              </svg>
              Editar
            </button>
            <button
              class="btn-icon-sm danger"
              id="detailDeleteBtn"
              onclick="confirmDeleteFromDetail()"
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" />
                <path d="M10 11v6M14 11v6" />
                <path d="M9 6V4h6v2" />
              </svg>
              Excluir
            </button>
          </div>
          <button class="btn-secondary" onclick="closeDetail()">Fechar</button>
        </div>
      </div>
    </div>

    <!-- ═══ Add/Edit Component Modal ═══ -->
    <div class="overlay" id="compOverlay">
      <div class="form-modal">
        <div class="modal-head">
          <div class="modal-head-info">
            <div class="modal-head-title" id="compModalTitle">Nova seção</div>
          </div>
          <button class="btn-close" onclick="closeCompModal()">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="form-body">
          <div class="field">
            <label>Nome da seção</label>
            <input
              type="text"
              id="cName"
              placeholder="Ex: Garantia 30 dias verde"
            />
          </div>
          <div class="field">
            <label>Descrição (opcional)</label>
            <input
              type="text"
              id="cDesc"
              placeholder="Ex: Fundo verde, ícone de escudo, texto centralizado"
            />
          </div>
          <div class="field">
            <label>Imagem / screenshot da seção</label>
            <div
              class="upload-area"
              onclick="document.getElementById('imgInput').click()"
            >
              <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                style="color: var(--text3); margin: 0 auto; display: block"
              >
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
              </svg>
              <p>Clique para escolher uma imagem</p>
              <small>PNG, JPG, WEBP — aparece no card e no modal</small>
            </div>
            <input
              type="file"
              id="imgInput"
              accept="image/*"
              style="display: none"
              onchange="handleImg(this)"
            />
            <img id="imgPreview" alt="Preview" />
          </div>
          <div class="field">
            <label>Código</label>
            <div class="code-tabs">
              <button
                class="code-tab-btn active"
                onclick="switchFormTab('html', this)"
              >
                HTML
              </button>
              <button class="code-tab-btn" onclick="switchFormTab('css', this)">
                CSS
              </button>
              <button class="code-tab-btn" onclick="switchFormTab('js', this)">
                JS
              </button>
            </div>
            <div class="tab-fields active" id="ftab-html">
              <textarea
                id="cHtml"
                placeholder="Cole aqui o HTML da seção..."
              ></textarea>
            </div>
            <div class="tab-fields" id="ftab-css">
              <textarea
                id="cCss"
                placeholder="Cole aqui o CSS (sem tags style)..."
              ></textarea>
            </div>
            <div class="tab-fields" id="ftab-js">
              <textarea
                id="cJs"
                placeholder="Cole aqui o JavaScript (sem tags script)..."
              ></textarea>
            </div>
            <div class="field-hint">
              Cada parte é salva separadamente e pode ser copiada
              individualmente.
            </div>
          </div>
        </div>
        <div class="form-footer">
          <button class="btn-secondary" onclick="closeCompModal()">
            Cancelar
          </button>
          <button class="btn-primary" onclick="saveComp()">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
            Salvar seção
          </button>
        </div>
      </div>
    </div>

    <!-- ═══ Category Modal ═══ -->
    <div class="overlay" id="catOverlay">
      <div class="form-modal sm">
        <div class="modal-head">
          <div class="modal-head-info">
            <div class="modal-head-title" id="catModalTitle">
              Nova categoria
            </div>
          </div>
          <button class="btn-close" onclick="closeCatModal()">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="form-body">
          <div class="field">
            <label>Nome da categoria</label>
            <input
              type="text"
              id="catName"
              placeholder="Ex: Garantia, FAQ, Hero, Preco..."
            />
          </div>
          <div class="field">
            <label>Icone (opcional)</label>
            <input
              type="text"
              id="catEmoji"
              placeholder="Ex: icone ou abreviacao da categoria"
            />
          </div>
          <div class="field-row">
            <div class="field">
              <label>Cor do badge (fundo)</label>
              <input
                type="color"
                id="catBg"
                value="#ede8ff"
                style="height: 38px; cursor: pointer"
              />
            </div>
            <div class="field">
              <label>Cor do texto</label>
              <input
                type="color"
                id="catColor"
                value="#4423A7"
                style="height: 38px; cursor: pointer"
              />
            </div>
          </div>
        </div>
        <div class="form-footer">
          <button class="btn-secondary" onclick="closeCatModal()">
            Cancelar
          </button>
          <button class="btn-primary" onclick="saveCat()">
            Salvar categoria
          </button>
        </div>
      </div>
    </div>

    <!-- ═══ Confirm Modal ═══ -->
    <div class="overlay" id="confirmOverlay">
      <div class="form-modal sm">
        <div class="modal-head">
          <div class="modal-head-info">
            <div class="modal-head-title">Confirmar exclusao</div>
          </div>
          <button class="btn-close" onclick="closeConfirm()">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="form-body">
          <p class="confirm-text" id="confirmText"></p>
        </div>
        <div class="form-footer">
          <button class="btn-secondary" onclick="closeConfirm()">
            Cancelar
          </button>
          <button class="btn-danger" id="confirmBtn">Excluir</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="assets/js/main.js"></script>
  </body>
</html>
